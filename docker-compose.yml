services:
  mysql:
    image: mysql:8.0
    container_name: incident_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: incident_db
    ports:
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: incident_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./Backend
    container_name: incident_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=mysql://root:rootpassword@mysql:3306/incident_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=Ils6ZsfsoM7eWs3lP99S7Ft4BwRUCDPva1M70yW4w7X
      - FRONTEND_URL=http://localhost:8080
      - CORRELATION_WINDOW_MINUTES=60
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./Frontend
    container_name: incident_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysqldata: